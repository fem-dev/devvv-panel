[project]
name = "devvv-panel"
version = "0.1.0"
description = "Persian RTL Marimo dashboard for miner compatibility and pool configuration"
requires-python = ">=3.10"
dependencies = ["marimo>=0.14,<1.0", "psutil>=5.9,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
